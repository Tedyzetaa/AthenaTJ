<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot TS</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js" defer></script>
</head>
<body>
  <div class="app-container" aria-live="polite">
    <main class="chat-panel">
      <div id="chat-container"></div>
      <form id="chat-form" class="chat-form">
        <label for="user-input" class="visually-hidden">Digite sua mensagem</label>
        <input id="user-input" type="text" placeholder="Digite sua mensagem..." autocomplete="off" required>
        <button id="send-btn" type="submit">Enviar</button>
      </form>
    </main>
  </div>
</body>
</html>
